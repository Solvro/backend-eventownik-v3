services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventownik
      POSTGRES_PASSWORD: eventownik
      POSTGRES_DB: eventownik
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventownik
      POSTGRES_PASSWORD: eventownik
      POSTGRES_DB: eventownik_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  garage:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    ports:
      - "9000:3900"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  garage-public:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - garage
    ports:
      - "9002:9002"
    volumes:
      - ./garage/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  postgres_data:
  postgres_test_data:
  redis_data:
  garage_meta:
  garage_data:
