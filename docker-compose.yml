services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventownik
      POSTGRES_PASSWORD: eventownik
      POSTGRES_DB: eventownik
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: localdev
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio_data:/data
    entrypoint: >
      /bin/sh -c "
      minio server /data --console-address ':9001' &
      until mc alias set local http://localhost:9000 localdev password; do sleep 1; done;
      mc mb --ignore-existing local/events local/forms;
      mc anonymous set download local/events;
      mc anonymous set download local/forms;
      wait
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
